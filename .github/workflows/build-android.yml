name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies & Apply Patches
        run: npm ci

      - name: ⚙️ Generate Native Android Project & Configure Architecture Splits
        run: |
          npx expo prebuild --platform android --clean
          echo "react.enableSeparateBuildPerCPUArchitecture=true" >> android/gradle.properties

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: 🔨 Build Android APK (Architecture Splits)
        working-directory: android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release' }}"
          echo "Selected build type: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew assembleDebug -Preact.enableSeparateBuildPerCPUArchitecture=true --no-daemon
          else
            ./gradlew assembleRelease -Preact.enableSeparateBuildPerCPUArchitecture=true --no-daemon
          fi

      - name: ✍️ Sign Unsigned APKs (if unsigned)
        working-directory: android
        run: |
          UNSIGNED_APKS=$(find app/build/outputs/apk -name "*unsigned*.apk")
          if [ -n "$UNSIGNED_APKS" ]; then
            echo "Signing unsigned APKs with debug keystore for easy testing & installation..."
            BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 | sort -V | tail -n 1)
            KEYSTORE="app/debug.keystore"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkey -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AndroidDebug,O=Android,C=US"
            fi
            for UNSIGNED_APK in $UNSIGNED_APKS; do
              echo "Signing $UNSIGNED_APK..."
              SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}-signed.apk"
              $BUILD_TOOLS_DIR/apksigner sign --ks "$KEYSTORE" --ks-pass pass:android --key-pass pass:android --out "$SIGNED_APK" "$UNSIGNED_APK"
              echo "Created signed APK: $SIGNED_APK"
            done
          fi

      - name: 📦 Prepare Architecture-Specific APKs for Release
        run: |
          echo "Scanning for built APKs..."
          for apk in $(find android/app/build/outputs/apk -type f \( -name "*-signed.apk" -o -name "*-release.apk" -o -name "*-debug.apk" \) ! -name "*unsigned*"); do
            filename=$(basename "$apk")
            echo "Processing $filename at $apk"
            if [[ "$filename" == *"arm64-v8a"* ]]; then
              cp "$apk" ./ClassTrack-arm64-v8a.apk
              cp "$apk" ./ClassTrack.apk
            elif [[ "$filename" == *"armeabi-v7a"* ]]; then
              cp "$apk" ./ClassTrack-armeabi-v7a.apk
            elif [[ "$filename" == *"x86_64"* ]]; then
              cp "$apk" ./ClassTrack-x86_64.apk
            elif [[ "$filename" == *"x86"* ]]; then
              cp "$apk" ./ClassTrack-x86.apk
            elif [[ "$filename" == *"universal"* ]]; then
              cp "$apk" ./ClassTrack-universal.apk
            fi
          done

          # Fallback if specific ABI names weren't matched
          if [ ! -f ./ClassTrack.apk ]; then
            ANY_APK=$(find android/app/build/outputs/apk -type f -name "*.apk" ! -name "*unsigned*" | head -n 1)
            if [ -n "$ANY_APK" ]; then
              cp "$ANY_APK" ./ClassTrack.apk
            fi
          fi

          echo "Prepared APKs for release:"
          ls -lh ./ClassTrack*.apk

      - name: 🚀 Publish to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-b${{ github.run_number }}"
          name: "ClassTrack v1.0.0 (Build #${{ github.run_number }})"
          body: |
            ## 📱 ClassTrack Android Build
            - **Commit**: `${{ github.sha }}`
            - **Branch**: `${{ github.ref_name }}`
            - **Type**: `${{ github.event.inputs.build_type || 'release' }}`
            
            ### 📥 Which APK should I download?
            - **`ClassTrack-arm64-v8a.apk`** (or **`ClassTrack.apk`**) (~30 MB): **Recommended!** For 99% of modern Android smartphones (Samsung, Google Pixel, OnePlus, Xiaomi, Motorola, etc.).
            - **`ClassTrack-armeabi-v7a.apk`** (~25 MB): For older 32-bit Android phones.
            - **`ClassTrack-x86_64.apk`** (~30 MB): For Android emulators or x86 Chromebooks/tablets.
            
            ### 📲 Installation Instructions
            1. Download the appropriate `.apk` file directly to your Android device.
            2. Tap the file in your notification bar or Downloads folder to install.
          draft: false
          prerelease: false
          files: |
            ./ClassTrack*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
